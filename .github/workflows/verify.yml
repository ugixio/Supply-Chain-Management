# The green-gate in CI (ADR-0012): runs exactly what a developer runs locally.
# Toolchain: pnpm workspaces + Turborepo (ADR-0022).
# Python gate (U7): a CI-light requirements split installs only pytest; `make verify-full`
# runs services/calc/tests (stdlib-only). The full ML stack in requirements.txt stays out
# of CI (risk register #6 — numpy/torch/tensorflow are too heavy for the merge gate).
name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: pnpm install --frozen-lockfile
      - run: make verify-full
