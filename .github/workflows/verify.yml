# The green-gate in CI (ADR-0012): runs exactly what a developer runs locally.
# Toolchain: pnpm workspaces + Turborepo (ADR-0022) and a Cargo workspace (ADR-0035).
# ADR-0037 deleted the invented SCM application, so the Python steps went with the code they
# tested. What remains: the doc gates, a typecheck over the standards reference module, and the
# Rust money core, and — since M2 — the ClickHouse telemetry schema, applied against a real server.
# The runner image ships a stable toolchain, so no third-party setup action is added;
# `rustup component add` covers clippy/rustfmt if absent, and the cargo registry and build output
# are cached so the merge gate does not pay a cold download every run.
#
# Two gate invocations, not one: `verify-full` is portable and `verify-schema` needs the service
# container. See the Makefile header for why that split is deliberate.
name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # Pinned version, not `latest`: a gate whose server can change under it is not reproducible.
      # DEFAULT_ACCESS_MANAGEMENT is required for the CREATE ROLE / QUOTA statements in 0005.
      clickhouse:
        image: clickhouse/clickhouse-server:24.8-alpine
        env:
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --spider -q http://localhost:8123/ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: rustup component add clippy rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: make verify-full
      - run: make verify-schema
        env:
          CLICKHOUSE_URL: http://localhost:8123
