# The green-gate in CI (ADR-0012): runs exactly what a developer runs locally.
# Toolchain: pnpm workspaces + Turborepo (ADR-0022).
# Python gate joins when U7 lands a pytest suite + a CI-light requirements split
# (risk register #6 — the full ML stack is too heavy for CI).
name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make verify-full
