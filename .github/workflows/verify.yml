# The green-gate in CI (ADR-0012): runs exactly what a developer runs locally.
# Toolchain: pnpm workspaces + Turborepo (ADR-0022) and a Cargo workspace (ADR-0035).
# ADR-0037 deleted the invented SCM application, so the Python steps went with the code they
# tested. What remains: the doc gates, a typecheck over the standards reference module, and the
# Rust money core. The runner image ships a stable toolchain, so no third-party setup action is
# added; `rustup component add` covers clippy/rustfmt if absent, and the cargo registry and
# build output are cached so the merge gate does not pay a cold download every run.
name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: rustup component add clippy rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: make verify-full
