# Cargo workspace.
#
# Rust owns the core lane (ADR-0033/0035, ENG-R10): rules, invariants, exact arithmetic, the
# per-event hot path and ingestion. Two crates today. `scm-money` is what survived ADR-0037, which
# deleted the invented supply-chain application the other crates served. `scm-ingest` is the lane
# back in use for the monitoring application (WORKFLOW Phase M): the ingester's core — normalize,
# validate, deduplicate and batch, with no transport in it.
#
# No I/O framework enters a core crate; transport belongs in an adapter crate.
# Crates are added when there is work for them, never as an empty skeleton.

[workspace]
resolver = "3"
members = ["crates/scm-ingest", "crates/scm-money"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
# MIT — exact 96-bit fixed-point decimal. Chosen over `bigdecimal` because money here is
# bounded minor units, and a fixed 96-bit mantissa is allocation-free on the hot path.
rust_decimal = { version = "1", default-features = false, features = ["std"] }
# MIT/Apache-2.0 — test-only, reads the shared golden fixture (U8).
serde_json = "1"

# Release profile for the artefact that will back `napi-rs`: optimize, and keep overflow
# checks on — a silent wrap in money arithmetic is worse than a panic (ENG-R4).
[profile.release]
overflow-checks = true
panic = "unwind"
lto = "thin"
codegen-units = 1
