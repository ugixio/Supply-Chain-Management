[package]
name = "scm-core"
version = "0.1.0"
description = "The SCM core: business rules, invariants and state machines for the 14 departments (ADR-0035, ENG-R10). Pure — no I/O framework, no clock, no identity source."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rust_decimal.workspace = true
scm-money = { path = "../scm-money" }

[lints.rust]
unsafe_code = "forbid"
# `missing_docs` is deliberately NOT enabled. It cannot distinguish an undocumented rule from
# a self-describing record field, so with `-D warnings` it demands a line of prose on every
# `pub sku: String`. Doc comments here carry meaning — a rule ID, a unit, an invariant — and
# stay off the fields that only restate their own name.

[lints.clippy]
# Same posture as the money core: the code that enforces financial and compliance
# invariants may not truncate, wrap or panic silently (ENG-R10).
cast_possible_truncation = "deny"
float_arithmetic = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
