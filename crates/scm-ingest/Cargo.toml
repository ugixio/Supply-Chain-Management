[package]
name = "scm-ingest"
version = "0.1.0"
description = "Telemetry ingestion core: normalize, validate, deduplicate, batch (ADR-0036, ENG-R10)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Ingestion is the per-event hot path, and it is the only place where malformed input from
# outside the system arrives. A silent truncation or an unchecked unwrap here is a defect that
# shows up as missing telemetry hours later, so both are denied (ENG-R10).
cast_possible_truncation = "deny"
cast_precision_loss = "deny"
unwrap_used = "deny"
expect_used = "deny"
