# Local ClickHouse for running the schema gate (`make verify-schema`).
#
# Pinned to an explicit version rather than `latest`: a gate whose server version can change under
# it is not reproducible. Bump deliberately, and re-run the gate when you do.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"   # required for CREATE ROLE / QUOTA in 0005
    ports:
      - "8123:8123"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 20
